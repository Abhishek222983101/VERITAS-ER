[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[patch.crates-io]
ephemeral-rollups-sdk = { path = "./vendor/ephemeral-rollups-sdk-0.10.5" }
ephemeral-vrf-sdk = { path = "./vendor/ephemeral-vrf-sdk-0.2.3" }
